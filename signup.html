<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — ExpenseTracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="logo">Expense<span class="dot">•</span>Tracker</a>
    <h1 style="margin-top:20px;">Create your account</h1>
    <p class="sub">Start tracking in under a minute.</p>

    <p class="auth-error" id="errorMsg"></p>

    <form id="signupForm">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" required placeholder="Your name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="At least 6 characters" minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Sign Up</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>

<script src="config.js"></script>
<script src="script.js"></script>
<script>
document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const errorEl = document.getElementById('errorMsg');
  errorEl.style.display = 'none';
  btn.textContent = 'Creating account...';
  btn.disabled = true;

  const payload = {
    action: 'signup',
    name: document.getElementById('name').value.trim(),
    email: document.getElementById('email').value.trim().toLowerCase(),
    password: document.getElementById('password').value
  };

  try {
    const res = await apiCall(payload);
    if (res.status === 'ok') {
      localStorage.setItem('ef_user', JSON.stringify(res.user));
      window.location.href = 'dashboard.html';
    } else {
      errorEl.textContent = res.message || 'Could not sign up. Try again.';
      errorEl.style.display = 'block';
    }
  } catch (err) {
    errorEl.textContent = 'Something went wrong. Check your API_URL in config.js.';
    errorEl.style.display = 'block';
  }
  btn.textContent = 'Sign Up';
  btn.disabled = false;
});
</script>
</body>
</html>
